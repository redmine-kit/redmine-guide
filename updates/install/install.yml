# Updates of the page for Redmine 7.0.3 (docs/updating.md#updates).
redmine: 7.0.3
updates:
  - why: The note markers in the table point to the wrong notes; the note on Ruby 4.0 is 2 and the note on MySQL is 3.
    source: the notes under the table on this page
    replace: |-
      <td>trunk</td>
      <td>Ruby 3.2, 3.3, 3.4, 4.0<sup>1</sup></td>
      <td>Rails 8.1</td>
      <td>14</td>
      <td>8.0 - 8.4<sup>2</sup></td>
    with: |-
      <td>trunk</td>
      <td>Ruby 3.2, 3.3, 3.4, 4.0<sup>2</sup></td>
      <td>Rails 8.1</td>
      <td>14</td>
      <td>8.0 - 8.4<sup>3</sup></td>
  - why: The note markers in the table point to the wrong notes; the note on Ruby 4.0 is 2 and the note on MySQL is 3.
    source: the notes under the table on this page
    replace: |-
      <td>7.0</td>
      <td>Ruby 3.2, 3.3, 3.4, 4.0<sup>1</sup></td>
      <td>Rails 8.1</td>
      <td>14</td>
      <td>8.0 - 8.4<sup>2</sup></td>
    with: |-
