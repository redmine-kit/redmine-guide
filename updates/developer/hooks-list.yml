# Updates of the page for Redmine 7.0.3 (docs/updating.md#updates).
redmine: 7.0.3
updates:
  - why: Redmine 7.0.3 has no redmine:plugins:hook_list rake task.
    source: lib/tasks/*.rake (no hook_list task)
    replace: |-
      To see the current list of plugin hooks, run `rake redmine:plugins:hook_list` in the Redmine directory.
    with: |-
      To see the current list of plugin hooks, search for `call_hook` in the Redmine directory as shown below (the `rake redmine:plugins:hook_list` task no longer exists in Redmine 7.0.3).
  - why: Helper hooks of Redmine 7.0.3 that the list did not have.
    source: app/helpers/queries_helper.rb:249, 289
    replace: |-
      | `:helper_issues_show_detail_after_setting` | Passes data to the hook to allow it to set the label and value. | `:detail, :label, :value, :old_value` |
    with: |-
