# Updates of the page for Redmine 7.0.3 (docs/updating.md#updates).
redmine: 7.0.3
updates:
  - why: The Documents API is not in Redmine 7.0.3 (DocumentsController accepts no API authentication and has no API views).
    source: app/controllers/documents_controller.rb (no accept_api_auth); app/views/documents (no *.api.rsb)
    replace: |-
      | [Documents](rest-documents.md) |  |  | 7.1 |
    with: |-
      | [Documents](rest-documents.md) |  | Not available in Redmine 7.0.3 | 7.1 |
  - why: The REST API setting is "Enable REST web service" on the Integrations tab; Redmine 6.1.0 added OAuth2 as a third way to authenticate.
    source: app/helpers/settings_helper.rb (label_integrations); app/views/settings/_api.html.erb; config/locales/en.yml (setting_rest_api_enabled, label_integrations); app/controllers/application_controller.rb (find_current_user)
    replace: |-
      To enable the API-style authentication, you have to check **Enable REST API** in Administration -\> Settings -\> API. Then, authentication can be done in 2 different ways:
    with: |-
      To enable the API-style authentication, you have to check **Enable REST web service** in Administration -\> Settings -\> Integrations. Then, authentication can be done in 3 different ways:
  - why: Since Redmine 5.0.0, HTTP Basic authentication with login and password is refused for users with two-factor authentication.
    source: app/controllers/application_controller.rb (find_current_user, "HTTP Basic authentication is not allowed. Use API key instead"); doc/CHANGELOG 5.0.0 Feature #35001
    replace: |-
      - using your regular login/password via HTTP Basic authentication.
    with: |-
      - using your regular login/password via HTTP Basic authentication (not allowed for users with two-factor authentication enabled, since Redmine 5.0.0; use the API key instead).
  - why: Redmine 6.1.0 added OAuth2 (authorization code flow) for API applications registered in Administration > Applications.
    source: app/controllers/application_controller.rb (Doorkeeper.authenticate); config/initializers/30-redmine.rb (grant_flows ['authorization_code']); lib/redmine/preparation.rb (admin menu :applications); doc/CHANGELOG 6.1.0 Feature #24808
    replace: |2-
        - passed in as a “X-Redmine-API-Key” HTTP header (added in Redmine 1.1.0)
    with: |2-
        - passed in as a “X-Redmine-API-Key” HTTP header (added in Redmine 1.1.0)
      - using an OAuth2 access token (`Authorization: Bearer <token>` header) issued to an application registered in Administration -\> Applications. Only the authorization code flow is supported (added in Redmine 6.1.0).
  - why: Redmine 7.0.3 still uses the content_type sent with an upload; ignoring it is a Redmine 7.1 change.
    source: app/controllers/attachments_controller.rb (upload, params[:content_type]); app/models/attachment.rb (safe_attributes 'content_type')
    replace: |-
      Note: as of Redmine [7.1.0](https://www.redmine.org/versions/228), the `content_type` attribute is ignored. Redmine detects the content type from the file contents instead.
    with: |-
      Note: as of Redmine version:7.1.0, the `content_type` attribute is ignored. Redmine detects the content type from the file contents instead. Redmine 7.0.3 still uses the attribute.
  - why: The JSONP setting is on the Integrations tab.
    source: app/helpers/settings_helper.rb (label_integrations); app/views/settings/_api.html.erb; config/locales/en.yml (setting_jsonp_enabled)
    replace: |-
      you can enable it by checking **Enable JSONP support** in Administration -\> Settings -\> API.
    with: |-
      you can enable it by checking **Enable JSONP support** in Administration -\> Settings -\> Integrations.
  - why: Redmine 7.0.3 still uses the content_type sent with an upload; ignoring it is a Redmine 7.1 change.
    source: app/controllers/attachments_controller.rb (upload, params[:content_type]); app/models/attachment.rb (safe_attributes 'content_type')
    replace: |-
      Neither returns an error. The value is simply ignored, so existing clients keep working. Only the stored content type changes.
    with: |-
      Neither returns an error. The value is simply ignored, so existing clients keep working. Only the stored content type changes.

      This change is not in Redmine 7.0.3, which still uses the content type sent by the client.
