# Updates of the page for Redmine 7.0.3 (docs/updating.md#updates).
redmine: 7.0.3
updates:
  - why: In Redmine 7.0.3, updating a journal with empty notes clears the notes but keeps the journal, even without details; the API cannot delete a journal.
    source: app/controllers/journals_controller.rb (accept_api_auth :update; update); app/models/journal.rb (save); test/integration/api_test/journals_test.rb ("without journal details should not destroy journal")
    replace: |-
      Journals cannot be deleted with the `DELETE` method. To delete a journal, update it with an empty `notes` value.
    with: |-
      Journals cannot be deleted through the API (there is no `DELETE` method). You can clear the notes of a journal by updating it with an empty `notes` value.
  - why: In Redmine 7.0.3, updating a journal with empty notes clears the notes but keeps the journal, even without details.
    source: app/models/journal.rb (save); test/integration/api_test/journals_test.rb ("without journal details should not destroy journal")
    replace: |-
      If the journal has no details and `notes` is set to an empty value, the journal is deleted.
    with: |-
      If `notes` is set to an empty value, the notes are cleared but the journal itself is kept, even if it has no details.
