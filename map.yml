# Redmine 7.0.3's screens -> topics (and heading anchors) of this guide, read
# by redmine_help (https://github.com/redmine-kit/redmine_help, docs/mapping.md).
# Keys: "controller#action?tab=value", "controller#action", "controller".
# Anchors are Redmine's heading anchors (spaces become "-"). A screen opens at
# the section that describes it: an action of its own (issues#new) or a tab
# (?tab=) comes before the controller's topic.

