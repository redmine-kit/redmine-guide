  developer/plugin-faq: { ja: プラグインのよくある質問, note: "Established term (FAQ → よくある質問)" }
  developer/theme: { ja: カスタムテーマの作成, source: "label_theme (テーマ)" }
  developer/submissions: { ja: redmine.org への投稿, note: The English title }
  developer/rest-api-with-ruby: { ja: Ruby で REST API を使う, note: "The English title; the same form for every language" }
