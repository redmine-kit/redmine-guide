  developer/release-management: { ja: リリース管理, note: Established term }
  developer/vendored-components: { ja: 同梱しているサードパーティのコンポーネント一覧, note: "The English title; vendored → 同梱" }
  developer/plugin-tutorial: { ja: プラグインのチュートリアル, source: "label_plugins (プラグイン)" }
