# The demo data of the Japanese screenshots (screenshots/screens.rb): what a
# Japanese team's Redmine shows. Trackers, issue statuses, priorities,
# activities, document categories and roles are named as Redmine 7.0.3's
# default data for Japanese (config/locales/ja.yml, default_*); the rest is
# translated. Identifiers (logins, project identifiers, file names, version
# numbers, email addresses) stay as they are.

# Records of Redmine's test fixtures, by model and id.
